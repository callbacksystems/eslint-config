version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@stylistic/*"
          - "typescript-eslint"
          - "eslint-import-resolver-*"
      runtime:
        patterns:
          - "globals"
          - "minimatch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
